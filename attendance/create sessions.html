<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Session | Lecturer Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #f0f2f5;
        }
        .topbar {
            background: #2c3e50;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .container {
            max-width: 700px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .card h1 {
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 0.3rem;
        }
        .subtext {
            color: #7f8c8d;
            margin-bottom: 1.8rem;
            font-size: 0.9rem;
            border-left: 3px solid #f39c12;
            padding-left: 0.8rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #2c3e50;
        }
        select, input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ccd1d9;
            border-radius: 12px;
            font-size: 1rem;
            transition: 0.2s;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #f39c12;
            box-shadow: 0 0 0 2px rgba(243,156,18,0.2);
        }
        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }
        .btn {
            flex: 1;
            padding: 0.8rem 1.2rem;
            border: none;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            text-decoration: none;
        }
        .btn-primary {
            background: #19034e;
            color: white;
        }
        .btn-primary:hover {
            background: #0c0242;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #ecf0f1;
            color: #2c3e50;
        }
        .btn-secondary:hover {
            background: #bdc3c7;
        }
        .message {
            margin-top: 1rem;
            padding: 0.8rem;
            border-radius: 12px;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .footer {
            text-align: center;
            padding: 1rem;
            background: #2c3e50;
            color: white;
            margin-top: 2rem;
        }
        @media (max-width: 550px) {
            .button-group { flex-direction: column; }
        }
    </style>
    <!-- Firebase -->
    
</head>
<body>
<div class="topbar">
    <div> eClass Lecturer Portal</div>
    <div><button id="logoutBtn" style="background:#e74c3c; color:white; border:none; padding:0.4rem 1rem; border-radius:8px; cursor:pointer;">Logout</button></div>
    
</div>
<a href="lec dashboard.html">← Back to Dashboard</a>
<div class="container">
    <div class="card">
        <h1> Start New Session</h1>
        <div class="subtext">A unique time‑bound attendance code will be generated</div>

        <div class="form-group">
            <label> Select Course</label>
            <select id="courseSelect">
                <option value="">-- Choose course --</option>
            </select>
        </div>

        <div class="form-group">
            <label>Session Duration (minutes)</label>
            <input type="number" id="sessionDuration" value="120" step="1" min="1">
            <small>Total length of the class / session</small>
        </div>

        <div class="form-group">
            <label>Code Validity (minutes)</label>
            <input type="number" id="codeValidity" value="10" step="1" min="1">
            <small>How long the generated code will remain active</small>
        </div>

        <div class="button-group">
            <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
            <button class="btn btn-primary" id="generateBtn"> Generate Code & Start</button>
        </div>

        <div id="message" class="message"></div>
    </div>
</div>

<div class="footer">
    <p>© 2026 eClass – Automated Attendance System</p>
</div>

<script src="https://www.gstatic.com/firebasejs/8.2.5/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/7.16.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.2.5/firebase-auth.js"></script>
<script src="js/config.js"></script>
<script>
(function(){
  const courseSelect = document.getElementById('courseSelect');
  const sessionDurationEl = document.getElementById('sessionDuration');
  const codeValidityEl = document.getElementById('codeValidity');
  const generateBtn = document.getElementById('generateBtn');
  const messageEl = document.getElementById('message');

  function showMessage(msg, type){
    if (!messageEl) return;
    messageEl.style.display = 'block';
    messageEl.className = 'message ' + (type === 'success' ? 'success' : 'error');
    messageEl.innerText = msg;
  }

  function escapeHtml(str){
    return String(str||'')
      .replace(/&/g,'&amp;')
      .replace(/</g,'<')
      .replace(/>/g,'>')
      .replace(/"/g,'"')
      .replace(/'/g,'&#039;');
  }

  function random6(){
    return String(Math.floor(100000 + Math.random()*900000));
  }

  function loadCoursesForLecturer(email){
    if (!courseSelect) return;
    courseSelect.innerHTML = '<option value="">-- Choose course --</option>';

    firebase.database().ref('Courses').once('value').then(snapshot=>{
      snapshot.forEach(cs=>{
        const c = cs.val();
        if (c && c.Lecturer === email && (c.Status === 'active' || c.Status === undefined)){
          const opt = document.createElement('option');
          opt.value = cs.key;
          opt.textContent = `${c.Coursename || cs.key} (${cs.key})`;
          courseSelect.appendChild(opt);
        }
      });
    });
  }

  firebase.auth().onAuthStateChanged(function(user){
    if (!user) { window.location.href = 'index.html'; return; }
    loadCoursesForLecturer(user.email);
  });

  if (generateBtn){
    generateBtn.addEventListener('click', async ()=>{
      const courseCode = courseSelect ? courseSelect.value : '';
      const sessionDurationMinutes = parseInt(sessionDurationEl.value, 10);
      const codeValidityMinutes = parseInt(codeValidityEl.value, 10);

      if (!courseCode){ showMessage('Please select a course', 'error'); return; }
      if (!Number.isFinite(sessionDurationMinutes) || sessionDurationMinutes <= 0){ showMessage('Invalid session duration', 'error'); return; }
      if (!Number.isFinite(codeValidityMinutes) || codeValidityMinutes <= 0){ showMessage('Invalid code validity', 'error'); return; }

      const user = firebase.auth().currentUser;
      if (!user) { showMessage('Login required', 'error'); return; }

      const sessionCode = random6();
      const createdAt = Date.now();
      const startTime = createdAt;
      const endTime = createdAt + sessionDurationMinutes * 60000;

      const payload = {
        courseCode: courseCode,
        lecturerEmail: user.email,
        createdAt: createdAt,
        sessionDurationMinutes: sessionDurationMinutes,
        codeValidityMinutes: codeValidityMinutes,
        startTime: startTime,
        endTime: endTime,
        status: 'active',
        sessionCode: sessionCode
      };

      try{
        await firebase.database().ref(`Sessions/${courseCode}/${sessionCode}`).set(payload);
        showMessage('Session created. Attendance code: ' + sessionCode, 'success');
      }catch(e){
        console.error(e);
        showMessage('Failed to create session', 'error');
      }
    });
  }
})();
</script>
</body>
</html>
