<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Attendance | eClass</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background:#f0f2f5; }
        .topbar { background:#1e2a3a; color:white; padding:1rem 2rem; display:flex; justify-content:space-between; align-items:center; }
        .container { max-width:800px; margin:2rem auto; padding:0 1rem; }
        .card { background:white; border-radius:16px; padding:2rem; box-shadow:0 2px 8px rgba(0,0,0,0.1); margin-bottom:2rem; }
        .form-group { margin-bottom:1.5rem; }
        label { display:block; margin-bottom:0.5rem; font-weight:bold; }
        select, input { width:100%; padding:0.8rem; border:1px solid #ccc; border-radius:8px; font-size:1rem; }
        .btn { background:#3498db; color:white; padding:0.8rem 1.5rem; border:none; border-radius:8px; cursor:pointer; font-size:1rem; }
        .btn:hover { background:#2980b9; }
        .message { padding:0.8rem; border-radius:8px; margin-bottom:1rem; display:none; }
        .success { background:#d4edda; color:#155724; }
        .error { background:#f8d7da; color:#721c24; }
        .back-link { display:inline-block; margin-bottom:1rem; color:#3498db; text-decoration:none; }
        .footer { text-align:center; padding:1rem; background:#1e2a3a; color:white; margin-top:2rem; }
    </style>
   
</head>
<body>
<div class="topbar">
    <div> Mark Attendance</div>
    <div><span id="userEmail"></span> | <a href="student portal.html" style="color:white">Dashboard</a></div>
</div>

<div class="container">
    <a href="student portal.html" class="back-link">← Back to Dashboard</a>
    <div class="card">
        <h2> Sign Attendance</h2>
        <p>Select a course you are enrolled in and enter the 6‑digit code.</p>
        <div id="message" class="message"></div>

        <div class="form-group">
            <label>Course</label>
            <select id="courseSelect">
                <option value="">-- Select course --</option>
            </select>
        </div>
        <div class="form-group">
            <label>6‑Digit Attendance Code</label>
            <input type="text" id="attendanceCode" maxlength="6" placeholder="e.g., 123456">
        </div>
        <button class="btn" id="submitAttendance">Submit Attendance</button>
    </div>
</div>

<div class="footer">
    <p>© 2026 eClass Attendance</p>
</div>
<script src="https://www.gstatic.com/firebasejs/8.2.5/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/7.16.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.2.5/firebase-auth.js"></script>	


<script src="js/config.js"> </script>
<script>
  function escapeHtml(str){
    return String(str||'')
      .replace(/&/g,'&amp;')
      .replace(/</g,'<')
      .replace(/>/g,'>')
      .replace(/"/g,'"')
      .replace(/'/g,'&#039;');
  }

  const messageEl = document.getElementById('message');
  function showMessage(msg, type){
    if (!messageEl) return;
    messageEl.style.display = 'block';
    messageEl.className = 'message ' + (type === 'success' ? 'success' : 'error');
    messageEl.innerText = msg;
  }

  function loadEnrolledCourses(){
    const courseSelect = document.getElementById('courseSelect');
    if (!courseSelect) return;

    const user = firebase.auth().currentUser;
    if (!user) return;

    const emailKey = user.email.replace(/\./g, '_');

    firebase.database().ref('Enrollments')
      .once('value')
      .then(snapshot => {
        courseSelect.innerHTML = `<option value="">-- Select course --</option>`;

        snapshot.forEach(courseSnap => {
          const courseCode = courseSnap.key;
          if (!courseSnap.hasChild(emailKey)) return;

          firebase.database().ref('Courses')
            .orderByChild('CourseCode')
            .equalTo(courseCode)
            .once('value')
            .then(courseData => {
              courseData.forEach(c => {
                const course = c.val();
                const option = document.createElement('option');
                option.value = courseCode;
                option.textContent = `${course.Coursename} (${courseCode})`;
                courseSelect.appendChild(option);
              });
            });
        });
      });
  }

  function randomAttendanceId(){
    return String(Date.now());
  }

  function isCodeValidFormat(code){
    return /^[0-9]{6}$/.test(String(code||''));
  }

  async function submitAttendance(){
    const courseSelect = document.getElementById('courseSelect');
    const attendanceCodeEl = document.getElementById('attendanceCode');
    const submitBtn = document.getElementById('submitAttendance');

    if (!courseSelect || !attendanceCodeEl) return;

    const courseCode = courseSelect.value;
    const attendanceCode = String(attendanceCodeEl.value||'').trim();

    if (!courseCode){ showMessage('Please select a course', 'error'); return; }
    if (!isCodeValidFormat(attendanceCode)){ showMessage('Attendance code must be 6 digits', 'error'); return; }

    const user = firebase.auth().currentUser;
    if (!user){ showMessage('Login required', 'error'); return; }

    const email = user.email;
    const studentEmailKey = email.replace(/\./g, '_');

    try{
      // Verify session by code + course. (sessionCode == attendanceCode)
      const sessionSnap = await firebase.database()
        .ref(`Sessions/${courseCode}/${attendanceCode}`)
        .once('value');

      if (!sessionSnap.exists()){
        showMessage('Invalid or expired code', 'error');
        return;
      }

      const session = sessionSnap.val();
      const now = Date.now();
      const endTime = Number(session.endTime || 0);
      const startTime = Number(session.startTime || 0);

      if (endTime && now > endTime){
        showMessage('This code has expired', 'error');
        return;
      }
      if (startTime && now < startTime){
        showMessage('Session has not started yet', 'error');
        return;
      }

      const attendanceRef = firebase.database().ref(`Attendance/${courseCode}/${attendanceCode}/${studentEmailKey}`);

      // prevent duplicate mark: if already exists, block
      const existing = await attendanceRef.once('value');
      if (existing.exists()){
        showMessage('You have already marked attendance for this session', 'success');
        return;
      }

      await attendanceRef.set({
        studentEmail: email,
        markedAt: now,
        status: 'Present',
        attendanceId: randomAttendanceId()
      });

      showMessage('Attendance marked successfully!', 'success');

      // update eligibility preview by redirecting to view.html?course=...&session=...
      const courseCodeEncoded = encodeURIComponent(courseCode);
      const sessionCodeEncoded = encodeURIComponent(attendanceCode);
      // keep user on page; but also provide quick link
      const msg = document.getElementById('message');
      msg.innerHTML = 'Attendance marked successfully! <a style="color:#155724; text-decoration:underline;" href="view.html?course='+courseCodeEncoded+'&session='+sessionCodeEncoded+'">View attendance</a>';

    }catch(e){
      console.error(e);
      showMessage('Failed to submit attendance', 'error');
    }
  }

  document.addEventListener('DOMContentLoaded', ()=>{
    firebase.auth().onAuthStateChanged(function(user){
      if (!user){ window.location.href = 'index.html'; return; }
      loadEnrolledCourses();

      // After courses load, disable submit if student has no enrollments
      setTimeout(()=>{
        const courseSelect = document.getElementById('courseSelect');
        const submitBtn = document.getElementById('submitAttendance');
        if (submitBtn && courseSelect){
          const hasAnyCourse = courseSelect.options && courseSelect.options.length > 1;
          submitBtn.disabled = !hasAnyCourse;
          if (!hasAnyCourse){
            showMessage('Please enroll in a course before marking attendance.', 'error');
          }
        }
      }, 600);

      const submitBtn = document.getElementById('submitAttendance');
      if (submitBtn){
        submitBtn.addEventListener('click', ()=>{
          submitAttendance();
        });
      }
    });
  });
</script>
</body>
</html>
