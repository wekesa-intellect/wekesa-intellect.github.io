<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Reports</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
        body { background:#f0f2f5; }
        .topbar { background:#2c3e50; color:white; padding:1rem 2rem; }
        .container { max-width:1200px; margin:2rem auto; padding:0 1rem; }
        .card { background:white; border-radius:16px; padding:1.5rem; margin-bottom:1.5rem; }
        table { width:100%; border-collapse:collapse; }
        th, td { padding:0.75rem; text-align:left; border-bottom:1px solid #ddd; }
        th { background:#f8f9fa; }
        .progress-bar { background:#e0e0e0; border-radius:10px; height:10px; width:100%; }
        .progress-fill { background:#2ecc71; height:10px; border-radius:10px; width:0%; }
        .eligible { color:green; font-weight:bold; }
        .not-eligible { color:red; }
    </style>
   
</head>
<body>
<div class="topbar">
    <div> Attendance Reports</div>
    <div><button onclick="logout()" style="background:#e74c3c; color:white; border:none; padding:0.3rem 0.8rem;">Logout</button></div>
</div>
<div class="container">
    <a href="lec dashboard.html">← Back To Dashboard</a>
    <div class="card">
        <h2 id="courseName"></h2>
        <div id="reportTable">Loading...</div>
    </div>
</div>
<div style="margin-bottom: 1rem; text-align: right;">
    <button onclick="exportToExcel(reportData, 'attendance')" style="background:#27ae60; color:white; padding:0.5rem 1rem; border:none; border-radius:8px; cursor:pointer;">📎 Export to Excel</button>

<script src="https://www.gstatic.com/firebasejs/8.2.5/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/7.16.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.2.5/firebase-auth.js"></script>
<script src="js/config.js"></script>
<script>
(function(){
  const courseNameEl = document.getElementById('courseName');
  const reportTableEl = document.getElementById('reportTable');

  function getQuery(name){
    return new URL(window.location.href).searchParams.get(name);
  }

  function escapeHtml(str){
    return String(str||'')
      .replace(/&/g,'&amp;')
      .replace(/</g,'<')
      .replace(/>/g,'>')
      .replace(/"/g,'"')
      .replace(/'/g,'&#039;');
  }

  // Minimal export used by the existing button. (Creates a CSV download.)
  window.exportToExcel = function(reportData, filename){
    if (!Array.isArray(reportData) || reportData.length === 0){
      alert('No data to export');
      return;
    }
    const headers = Object.keys(reportData[0]);
    const rows = reportData.map(r => headers.map(h => (r[h] ?? '')).join(','));
    const csv = [headers.join(','), ...rows].join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (filename || 'attendance') + '.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

  async function loadAttendance(){
    const courseCode = getQuery('course');
    const sessionCode = getQuery('session');
    if (!courseCode || !sessionCode){
      reportTableEl.innerHTML = 'Missing course/session in URL.';
      return;
    }

    if (courseNameEl) courseNameEl.textContent = `Attendance - ${courseCode} (Session ${sessionCode})`;
    reportTableEl.innerHTML = 'Loading...';

    // Load course name (optional)
    firebase.database().ref('Courses/' + courseCode).once('value').then(snap=>{
      const c = snap.val();
      if (c && courseNameEl) courseNameEl.textContent = `Attendance - ${c.Coursename || courseCode} (Session ${sessionCode})`;
    });

    // Students enrolled in this course
    const enrollSnap = await firebase.database().ref('Enrollments/' + courseCode).once('value');
    if (!enrollSnap.exists()){
      reportTableEl.innerHTML = 'No enrollments found for this course.';
      return;
    }

    const studentKeys = [];
    enrollSnap.forEach(child=>{
      studentKeys.push(child.key);
    });

    const report = [];
    let totalStudents = studentKeys.length;
    let presentCount = 0;

    // For each student, read attendance record
    for (const key of studentKeys){
      const attendSnap = await firebase.database().ref(`Attendance/${courseCode}/${sessionCode}/${key}`).once('value');
      const attendance = attendSnap.val();

      // enrollment info (email/name)
      const enrollment = (await firebase.database().ref(`Enrollments/${courseCode}/${key}`).once('value')).val();
      const studentEmail = enrollment?.email || attendance?.studentEmail || '';
      const firstName = enrollment?.FirstName || '';
      const lastName = enrollment?.LastName || '';

      const status = attendance?.status || (attendance ? 'Absent' : 'Absent');
      const markedAt = attendance?.markedAt || '';

      if (status === 'Present') presentCount++;

      report.push({
        studentEmail: studentEmail,
        firstName: firstName,
        lastName: lastName,
        status: status,
        markedAt: markedAt
      });
    }

    const percentage = totalStudents ? Math.round((presentCount/totalStudents)*100) : 0;

    const rowsHtml = report.map(r => `
      <tr>
        <td>${escapeHtml(r.studentEmail || '')}</td>
        <td>${escapeHtml((r.firstName||'') + ' ' + (r.lastName||''))}</td>
        <td class="${r.status === 'Present' ? 'eligible' : 'not-eligible'}">${escapeHtml(r.status)}</td>
        <td>${escapeHtml(r.markedAt ? new Date(r.markedAt).toLocaleString() : '')}</td>
      </tr>
    `).join('');

    reportTableEl.innerHTML = `
      <div style="margin-bottom:10px;">Present: <b>${presentCount}</b> / ${totalStudents} (${percentage}%)</div>
      <table>
        <thead>
          <tr>
            <th>Student Email</th>
            <th>Name</th>
            <th>Status</th>
            <th>Marked At</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    `;

    // expose for export button
    window.reportData = report;
  }

  firebase.auth().onAuthStateChanged(function(user){
    if (!user){ window.location.href = 'index.html'; return; }
    loadAttendance().catch(err=>{
      console.error(err);
      reportTableEl.innerHTML = 'Failed to load attendance.';
    });
  });
})();
</script>
</body>
</html>
