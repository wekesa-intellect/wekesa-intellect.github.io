<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Reports</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
        body { background:#f0f2f5; }
        .topbar { background:#2c3e50; color:white; padding:1rem 2rem; }
        .container { max-width:1200px; margin:2rem auto; padding:0 1rem; }
        .card { background:white; border-radius:16px; padding:1.5rem; margin-bottom:1.5rem; }
        table { width:100%; border-collapse:collapse; }
        th, td { padding:0.75rem; text-align:left; border-bottom:1px solid #ddd; }
        th { background:#f8f9fa; }
        .progress-bar { background:#e0e0e0; border-radius:10px; height:10px; width:100%; }
        .progress-fill { background:#2ecc71; height:10px; border-radius:10px; width:0%; }
        .eligible { color:green; font-weight:bold; }
        .not-eligible { color:red; }
    </style>
   
</head>
<body>
<div class="topbar">
    <div> Attendance Reports</div>
    <div><button onclick="logout()" style="background:#e74c3c; color:white; border:none; padding:0.3rem 0.8rem;">Logout</button></div>
</div>
<div class="container">
    <a href="lec dashboard.html">← Back To Dashboard</a>
    <div class="card">
        <h2 id="courseName"></h2>
        <div id="reportTable">Loading...</div>
    </div>
</div>
<div style="margin-bottom: 1rem; text-align: right;">
    <button onclick="exportToExcel(reportData, 'attendance')" style="background:#27ae60; color:white; padding:0.5rem 1rem; border:none; border-radius:8px; cursor:pointer;">📎 Export to Excel</button>
</body>
</html>
