<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enroll in Courses | eClass</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #f0f2f5;
        }
        .topbar {
            background: #1e2a3a;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .course-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .course-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid #e0e0e0;
            flex-wrap: wrap;
        }
        .course-info h3 {
            margin-bottom: 0.3rem;
        }
        .course-info p {
            color: #5a6e7c;
            font-size: 0.9rem;
        }
        .btn {
            padding: 0.5rem 1.2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-enroll {
            background: #2ecc71;
            color: white;
        }
        .btn-unenroll {
            background: #e74c3c;
            color: white;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 1rem;
            color: #3498db;
            text-decoration: none;
        }
        .footer {
            text-align: center;
            padding: 1rem;
            background: #1e2a3a;
            color: white;
            margin-top: 2rem;
        }
        .message {
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
    
</head>
<body>
<div class="topbar">
    <div class="logo"> eClass Enrollment</div>
    <div><span id="userEmail"></span> | <a href="student portal.html" style="color:white">Dashboard</a></div>
</div>

<div class="container">
    <a href="student portal.html" class="back-link">← Back to Dashboard</a>
    <div class="card">
        <h2>Available Courses</h2>
        <p>Enroll in courses to be able to mark attendance.</p>
        <div id="message" class="message"></div>
        <div id="coursesContainer" class="course-list">Loading courses...</div>
    </div>
</div>

<div class="footer">
    <p>© 2026 eClass Attendance</p>
</div>
</body>
</html>
