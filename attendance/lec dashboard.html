<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturer Dashboard | eClass</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
        body { background:#f0f2f5; }
        .topbar { background:#2c3e50; color:white; padding:1rem 2rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; }
        .container { max-width:1200px; margin:2rem auto; padding:0 1rem; }
        .card { background:white; border-radius:16px; padding:1.5rem; margin-bottom:2rem; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
        .course-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:1.5rem; margin-top:1rem; }
        .course-card { background:#f8f9fa; border-radius:12px; padding:1.2rem; border-left:5px solid #3498db; transition:0.2s; }
        .course-card h3 { margin-bottom:0.5rem; }
        .btn { display:inline-block; background:#3498db; color:white; padding:0.5rem 1rem; border-radius:8px; text-decoration:none; margin-right:0.5rem; margin-top:0.5rem; border:none; cursor:pointer; font-size:0.9rem; }
        .btn-warning { background:#f39c12; }
        .logout-btn { background:#e74c3c; }
        .footer { text-align:center; padding:1rem; background:#2c3e50; color:white; margin-top:2rem; }

        /* Action row - keeps them on same line */
        .action-row {
            display: flex;
            gap: 1rem;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        /* Golden styled cards */
        .action-card {
            flex: 1;
            text-align: center;
            background: linear-gradient(135deg, #f9e0a0, #d4af37); /* golden gradient */
            padding: 1rem;
            border-radius: 12px;
            text-decoration: none;
            color: #0e012c; /* dark blue text */
            transition: 0.2s;
            border: 1px solid #c9a03d;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .action-card h3 {
            margin: 0;
            font-weight: bold;
        }
        .action-card:hover {
            background: linear-gradient(135deg, #ffedb0, #e6bc2c);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            color: #4a2e00;
        }
    </style>
</head>
<body>
<div class="topbar">
    <div class="topbar">
    <div class="logo">
        <img src="assets/images.jpg" alt="logo">
    </div>
    <div class="user">
        <span id="userEmail">Loading...</span>
       
    </div>
</div>
    <div>Lecturer Portal - eClass Attendance</div>
    <div><span id="lecturerName"></span> <button class="btn logout-btn" onclick="logout()">Logout</button></div>
</div>
<a href="index.html"onclick="logout()">Logout</a>

<div class="container">
    <div class="card">
        <h2>My Assigned Courses</h2>
        <div id="coursesContainer">Loading...</div>
    </div>
</div>

<!-- Three action cards now with golden colors, still on same line -->
<div class="container">
    <div class="card">
        <div class="action-row">
            <a href="create sessions.html" class="action-card">
                <h3>Create Sessions</h3>
            </a>
            <a href="manage session.html" class="action-card">
                <h3>Manage Sessions</h3>
            </a>
            <a href="view attendance.html" class="action-card">
                <h3>View Students Attendance Records</h3>
            </a>
        </div>
    </div>
</div>

<div class="footer">
    <p>© 2026 eClass Attendance System</p>
</div>


<script src="https://www.gstatic.com/firebasejs/8.2.5/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/7.16.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.2.5/firebase-auth.js"></script>
<script src="js/config.js"></script>
<script>
(function(){
  const coursesContainer = document.getElementById('coursesContainer');
  const userEmailEl = document.getElementById('userEmail');
  const lecturerNameEl = document.getElementById('lecturerName');

  function escapeHtml(str){
    return String(str||'')
      .replace(/&/g,'&amp;')
      .replace(/</g,'<')
      .replace(/>/g,'>')
      .replace(/"/g,'"')
      .replace(/'/g,'&#039;');
  }

  function loadLecturerCourses(user){
    if (!user || !user.email) return;
    const email = user.email;
    if (userEmailEl) userEmailEl.textContent = email;
    if (lecturerNameEl) lecturerNameEl.textContent = user.email;

    firebase.database().ref('Courses').once('value').then(snapshot=>{
      if (!coursesContainer) return;
      coursesContainer.innerHTML = '';

      const myCourses = [];
      snapshot.forEach(cs=>{
        const course = cs.val();
        if (course && course.Lecturer === email && (course.Status === 'active' || course.Status === undefined)){
          myCourses.push({ code: cs.key, ...course });
        }
      });

      if (myCourses.length === 0){
        coursesContainer.innerHTML = '<p>No assigned courses found.</p>';
        return;
      }

      coursesContainer.innerHTML = myCourses.map(c=>{
        const code = escapeHtml(c.CourseCode || c.code);
        const name = escapeHtml(c.Coursename || c.Coursename);
        return `
          <div class="course-card">
            <h3>${name}</h3>
            <p><b>Course Code:</b> ${code}</p>
            <p><b>Venue:</b> ${escapeHtml(c.Venue || '')}</p>
            <a class="btn" href="create sessions.html?course=${encodeURIComponent(code)}">Create Session</a>
            <a class="btn btn-warning" href="manage session.html?course=${encodeURIComponent(code)}">Manage Sessions</a>
          </div>
        `;
      }).join('');
    });
  }

  firebase.auth().onAuthStateChanged(function(user){
    if (!user){
      window.location.href = 'index.html';
      return;
    }
    loadLecturerCourses(user);
  });
})();
</script>
</body>
</html>
