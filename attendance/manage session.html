<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Sessions</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
        body { background:#f0f2f5; }
        .topbar { background:#2c3e50; color:white; padding:1rem 2rem; display:flex; justify-content:space-between; }
        .container { max-width:1200px; margin:2rem auto; padding:0 1rem; }
        .card { background:white; border-radius:16px; padding:1.5rem; margin-bottom:1.5rem; }
        table { width:100%; border-collapse:collapse; }
        th, td { padding:0.75rem; text-align:left; border-bottom:1px solid #ddd; }
        th { background:#f8f9fa; }
        .btn { background:#3498db; color:white; padding:0.3rem 0.8rem; border-radius:5px; text-decoration:none; border:none; cursor:pointer; }
        .btn-danger { background:#e74c3c; }
        .badge { background:#2ecc71; color:white; padding:0.2rem 0.5rem; border-radius:20px; font-size:0.8rem; }
        .inactive { background:#95a5a6; }
    </style>
    
</head>
<body>
<div class="topbar">
    <div> Manage Attendance Sessions</div>
    <div><button class="btn" onclick="logout()" style="background:#e74c3c;">Logout</button></div>
</div>

<div class="container">
    <a href="lec dashboard.html">← Back to Dashboard</a>
    <div class="card">
        <h2 id="courseTitle"></h2>
        <div id="sessionsList">Loading sessions...</div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.2.5/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/7.16.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.2.5/firebase-auth.js"></script>
<script src="js/config.js"></script>
<script>
(function(){
  const courseTitleEl = document.getElementById('courseTitle');
  const sessionsListEl = document.getElementById('sessionsList');

  function escapeHtml(str){
    return String(str||'')
      .replace(/&/g,'&amp;')
      .replace(/</g,'<')
      .replace(/>/g,'>')
      .replace(/"/g,'"')
      .replace(/'/g,'&#039;');
  }

  function getQuery(name){
    const url = new URL(window.location.href);
    return url.searchParams.get(name);
  }

  function isExpired(endTime){
    if (!endTime) return false;
    return Date.now() > Number(endTime);
  }

  async function loadLecturerSessions(){
    const user = firebase.auth().currentUser;
    if (!user) return;

    const requestedCourse = getQuery('course');
    const lecturerEmail = user.email;

    // if courseCode provided, only load that course; else load first assigned course
    let courseCode = requestedCourse;
    if (!courseCode){
      const coursesSnap = await firebase.database().ref('Courses').once('value');
      let first;
      coursesSnap.forEach(cs=>{
        const c = cs.val();
        if (!first && c && c.Lecturer === lecturerEmail && (c.Status === 'active' || c.Status === undefined)){
          first = cs.key;
        }
      });
      courseCode = first;
    }

    if (!courseCode){
      sessionsListEl.innerHTML = 'No assigned course found.';
      return;
    }

    if (courseTitleEl) courseTitleEl.textContent = 'Sessions for ' + courseCode;

    const sessionsSnap = await firebase.database().ref('Sessions/' + courseCode).once('value');
    if (!sessionsListEl) return;
    sessionsListEl.innerHTML = '';

    if (!sessionsSnap.exists()){
      sessionsListEl.innerHTML = 'No sessions created yet.';
      return;
    }

    const rows = [];
    sessionsSnap.forEach(ss=>{
      const session = ss.val();
      // lecturer filter (by stored lecturerEmail)
      if (!session || session.lecturerEmail !== lecturerEmail) return;

      const sessionCode = ss.key;
      const expired = isExpired(session.endTime);
      rows.push(`
        <div class="course-item" style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #e0e0e0;">
          <div>
            <b>Session Code:</b> ${escapeHtml(sessionCode)}<br/>
            <span style="color:#666;">${expired ? 'Expired' : 'Active'}</span>
          </div>
          <div>
            <a class="btn" href="view attendance.html?course=${encodeURIComponent(courseCode)}&session=${encodeURIComponent(sessionCode)}">View Attendance</a>
          </div>
        </div>
      `);
    });

    sessionsListEl.innerHTML = rows.length ? rows.join('') : 'No sessions found for this lecturer.';
  }

  firebase.auth().onAuthStateChanged(function(user){
    if (!user){ window.location.href = 'index.html'; return; }
    loadLecturerSessions().catch(console.error);
  });
})();
</script>
</body>
</html>
