<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Sessions</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
        body { background:#f0f2f5; }
        .topbar { background:#2c3e50; color:white; padding:1rem 2rem; display:flex; justify-content:space-between; }
        .container { max-width:1200px; margin:2rem auto; padding:0 1rem; }
        .card { background:white; border-radius:16px; padding:1.5rem; margin-bottom:1.5rem; }
        table { width:100%; border-collapse:collapse; }
        th, td { padding:0.75rem; text-align:left; border-bottom:1px solid #ddd; }
        th { background:#f8f9fa; }
        .btn { background:#3498db; color:white; padding:0.3rem 0.8rem; border-radius:5px; text-decoration:none; border:none; cursor:pointer; }
        .btn-danger { background:#e74c3c; }
        .badge { background:#2ecc71; color:white; padding:0.2rem 0.5rem; border-radius:20px; font-size:0.8rem; }
        .inactive { background:#95a5a6; }
    </style>
    
</head>
<body>
<div class="topbar">
    <div> Manage Attendance Sessions</div>
    <div><button class="btn" onclick="logout()" style="background:#e74c3c;">Logout</button></div>
</div>

<div class="container">
    <a href="lec dashboard.html">← Back to Dashboard</a>
    <div class="card">
        <h2 id="courseTitle"></h2>
        <div id="sessionsList">Loading sessions...</div>
    </div>
</div>

</body>
</html>
