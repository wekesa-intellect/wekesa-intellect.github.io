<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/media print.css">
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo">
    <img src="assets/images.jpg" alt="logo" width="20%">
  </div>
  <div class="user">
    <label id="lbusername">username</label>
  </div>
</div>

<!-- NAVIGATION -->
<header class="header">
  <button class="menu-toggle">☰</button>
  <nav class="nav">
    <a href="#">Dashboard</a>
    <a href="courses.html">Courses</a>
    <a href="students.html">Students</a>
    <a href="admins.html">Admins</a>
    <a href="reports.html">Reports</a>
    <a href="gps.html">GPS</a>
    <a href="index.html"onclick="logout()">Logout</a>
  </nav>
</header>

<!-- MAIN -->
<main class="container">

  <!-- Cards -->
  <div class="cards-grid">
    <div class="card">
      <h3>Total Users</h3>
      <canvas id="mybargraph"></canvas>
    </div>
    <div class="card">
      <h3>Courses</h3>
     <canvas id="mypiechart"></canvas>
    </div>
    <div class="card">
      <h3> Lecturers</h3>
      <canvas id="mydoughnut"></canvas>
    </div>
  <div class="card">
    <h3>Students</h3>
   <canvas id="mybubblechart"></canvas>
 </div>
</main>
<!-- Print Button -->
<div style="text-align: right; margin-bottom: 12px;">
  <button class="btn-primary" onclick="window.print()">🖨️ Print Dashboard</button>
</div>

<!-- FOOTER -->
<footer class="footer">
  <p>© 2026 eClass Attendance</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.2.5/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/7.16.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.2.5/firebase-auth.js"></script>	


<script src="js/config.js"> </script>
<script src="js/report.js"> </script>

<script>
  const menuToggle = document.querySelector('.menu-toggle');
  const nav = document.querySelector('.nav');
  menuToggle.addEventListener('click', () => {
    nav.classList.toggle('active');
    menuToggle.textContent = nav.classList.contains('active') ? "✖" : "☰";
  });
let lbusername = document.getElementById('lbusername')
  auth.onAuthStateChanged( function(user) {
    if(user){
      let username = user.email.split('@')[0]
      lbusername.innerHTML = user.email
    }else{
      window.location = 'index.html'
    }
  })
</script>

</body>
</html>
